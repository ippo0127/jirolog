name: IndexNow (weekly)

# 週1回、この1週間に更新されたページを IndexNow（Bing など）に知らせる。
# Google には sitemap.xml と Search Console で知らせている。

on:
  schedule:
    - cron: "0 22 * * 0" # 毎週月曜 7:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/indexnow.py
